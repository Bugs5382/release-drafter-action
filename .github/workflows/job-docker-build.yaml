name: Docker Build
# The action runs as a Docker container action (action.yml -> Dockerfile), but
# nothing else in CI builds that image, so a broken Dockerfile only surfaces when
# the action is actually invoked. `uses: ./` builds the image from this checkout
# and then runs it with dry-run: true against the shared Bugs5382/.github config
# (the same extends pin job-release-drafter.yaml uses), the integration check: a
# Dockerfile regression, a bad flag, a config.Load path or a GraphQL query fails
# the PR even though every package's own tests passed.
#
# Pull requests only, and not while the PR is a draft. There is no push trigger:
# the PR run already built the tree being merged.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  docker:
    name: 🐳 Action image builds
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run the action against this checkout (dry run)
        uses: ./
        with:
          extends: Bugs5382/.github@main
          dry-run: true
