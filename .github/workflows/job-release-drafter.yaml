name: Release Drafter
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Draft release notes
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          extends: Bugs5382/.github@main
